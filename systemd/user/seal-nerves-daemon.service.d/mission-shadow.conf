[Service]
# JARVIS pilot only. The code gate also requires agent == JARVIS.
# Shadow keeps the immutable mission ledger. Handoff adds deterministic
# read-only evidence plus a durable wake-up for JARVIS' native tool-less
# reasoner. The daemon itself never launches a model or performs a repair.
Environment=SEAL_NERVES_MISSION_SHADOW=1
Environment=SEAL_NERVES_MISSION_HANDOFF=1
