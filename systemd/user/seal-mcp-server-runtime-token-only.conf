[Service]
# Store-A identity is authenticated only from the private runtime directory.
# /tmp remains preserved until William confirms the exact destructive cleanup,
# but the live MCP no longer reads it.
Environment=SEAL_DISABLE_LEGACY_TMP_TOKENS=1

# Enforce private metadata, TTL, revocation markers and current+next overlap.
Environment=SEAL_TOKEN_LIFECYCLE_MODE=ENFORCE
