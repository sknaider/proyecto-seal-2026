[package]
name = "seal-desktop"
version = "0.4.0"
description = "SEAL Studio — Desktop Agent"
authors = ["SEAL Team"]
edition = "2021"

[lib]
name = "seal_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "seal-desktop"
path = "src/main.rs"

[[bin]]
name = "soul-app-2"
path = "src/main.rs"

[[bin]]
name = "seal-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
