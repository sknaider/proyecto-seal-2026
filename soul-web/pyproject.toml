[project]
name = "soul-memory-web"
version = "0.1.4"
description = "Local conversational memory surface for SOUL Core"
requires-python = ">=3.11"
dependencies = [
    "soul-framework[ann,llm]>=0.4.3,<0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
soul-web = "soul_web.cli:main"
soul-web-backup = "soul_web.backup:main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soul_web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
