name: SEAL Golden Quality Gate

on:
  pull_request:
  push:
    branches: [main, feat/soul-spec-v1]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Activate and prove the repository hook
        run: |
          set -o pipefail
          git config core.hooksPath .githooks
          python scripts/seal_quality_gate.py hook-status | tee quality-hook-receipt.json
      - name: Build isolated quality environment
        run: |
          python -m venv .venv-quality
          .venv-quality/bin/python -m pip install -r quality/requirements.lock
          .venv-quality/bin/python -m pip install './soul-platform[dev]'
          .venv-quality/bin/python -m pip check
      - name: Audit all receipts statically
        run: |
          set -o pipefail
          .venv-quality/bin/python scripts/seal_quality_gate.py audit --policy quality/policy.json \
            | tee quality-audit-receipt.json
      - name: Execute immutable-base delta
        env:
          QUALITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SEAL_DB_DSN: postgresql://mcp_runtime_ci:synthetic@127.0.0.1:1/ci
        run: |
          set -o pipefail
          base="$QUALITY_BASE"
          test -n "$base"
          test "$base" != "0000000000000000000000000000000000000000"
          git cat-file -e "$base^{commit}"
          PATH="$PWD/.venv-quality/bin:$PATH" \
            .venv-quality/bin/python scripts/seal_quality_gate.py diff \
              --execute --policy quality/policy.json --base "$base" \
            | tee quality-diff-receipt.json
      - name: Mutation testing for the gate itself
        run: |
          set -o pipefail
          .venv-quality/bin/mutmut run
          .venv-quality/bin/mutmut export-cicd-stats
          .venv-quality/bin/python scripts/seal_quality_gate.py mutation-audit \
            quality/manifests/quality-gate-bootstrap.json \
            --stats mutants/mutmut-cicd-stats.json \
            | tee quality-mutation-receipt.json
      - name: Preserve quality receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seal-quality-receipts-${{ github.sha }}
          path: quality-*-receipt.json
