[project]
name = "seal-memory-gateway"
version = "0.1.0"
description = "SEAL Memory Gateway — resilient proxy between Claude Code and Soul DB backends"
authors = [{name = "NEXUS", email = "nexus@seal.local"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "asyncpg>=0.29",
    "pydantic>=2.9",
    "pybreaker>=1.0",
    "prometheus-client>=0.21",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
