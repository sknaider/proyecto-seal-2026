[project]
name = "soul-platform"
version = "0.4.0"
description = "SOUL Platform — contained agent runtime, coordination and autonomy for SOUL Core"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "soul-framework[ann]==0.4.2",
    "cryptography>=42",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
postgres = ["soul-framework[ann,postgres]==0.4.2"]
embeddings = ["soul-framework[ann,embeddings]==0.4.2"]
desktop = ["pywebview==6.2.1", "pystray==0.19.5", "pillow==12.3.0"]
all = ["soul-platform[postgres,embeddings,desktop]"]
dev = ["httpx>=0.27", "pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
soul-platform = "soul_platform.cli:main"
soul-machine = "soul_platform.bootstrap:main"
soul-machine-embedding-cutover = "soul_platform.embedding_cutover:main"
soul-tray-cli = "soul_platform.tray:main"

[project.gui-scripts]
soul-tray = "soul_platform.tray:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soul_platform"]

[tool.hatch.build]
exclude = [
    "/.pytest_cache",
    "/dist",
    "/dist-*",
    "/uv.lock",
    "/backend",
    "/runtime",
    "**/__pycache__",
    "**/*.pyc",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
