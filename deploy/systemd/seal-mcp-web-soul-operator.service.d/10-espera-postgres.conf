# NEXUS, 8-sep-2026 — carril asignado por JARVIS.
# 82 de 87 reinicios entre el 27-ago y el 7-sep fueron arrancar antes que
# Postgres: 78x ConnectionRefusedError contra 127.0.0.1:5433 y 4x
# "the database system is starting up". La unidad esperaba al witness y
# nada esperaba a la base.
#
# Este ExecStartPre se SUMA al del witness (no lo reemplaza) y corre despues.
# --reintentos-tras-abrir cubre los 4 casos en que el puerto ya acepta TCP
# pero la base todavia no acepta consultas.
[Service]
ExecStartPre=/usr/bin/python3 /usr/local/libexec/seal/seal_espera_puerto.py 127.0.0.1 5433 --timeout 60 --reintentos-tras-abrir 2
