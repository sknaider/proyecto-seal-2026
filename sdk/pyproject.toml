[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seal-memory"
version = "0.2.0"
description = "Python SDK for SEAL Memory — persistent memory, identity, and OCEAN personality for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
keywords = ["ai", "agents", "memory", "llm", "ocean", "personality"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
async = ["httpx>=0.27"]

[project.scripts]
seal-memory = "seal_memory.__main__:main"

[project.urls]
Homepage = "https://seal.ai"
Repository = "https://github.com/seal-ai/seal-memory"
Documentation = "https://github.com/seal-ai/seal-memory/blob/main/README.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["seal_memory*"]
