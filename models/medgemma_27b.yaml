name: medgemma-27b-it
model_path: /home/dadito/IA/modelos/llm/medgemma-27b-it
model_class: AutoModelForImageTextToText
processor_class: AutoProcessor
dtype: bfloat16

lora:
  rank: 64
  alpha: 16
  target_modules: ["q_proj", "v_proj"]
  dropout: 0.05
  task_type: CAUSAL_LM

training:
  max_seq_length: 1024
  per_device_batch_size: 1
  gradient_accumulation: 8
  learning_rate: 2e-4
  lr_scheduler_type: cosine          # evita oscilaciones por LR constante
  warmup_ratio: 0.05                 # warmup 5% de steps (reemplaza warmup_steps fijo)
  weight_decay: 0.01
  warmup_steps: 50
  bf16: true
  gradient_checkpointing: true

seal:
  kl_weight: 0.1
  null_percentile: 95.0
  fisher_alpha: 0.1
  replay_maxlen: 500
  replay_k: 10
  formats: ["implications", "rewrite", "self-qa", "clinical-summary"]
  self_edits_per_context: 3
  max_hours: 10.0
  checkpoint_every: 50
  save_total_limit: 10              # preservar los 10 mejores checkpoints — no perder el óptimo

system_prompt: >
  Eres un asistente médico experto. Responde en español de forma
  clara, precisa y completa.
