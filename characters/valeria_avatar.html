<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valeria Rios</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a0a0a;
  color: #e8d5c4;
  font-family: 'Segoe UI', system-ui, sans-serif;
  height: 100vh;
  overflow: hidden;
}

.container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  height: 100vh;
  gap: 0;
}

/* Avatar panel */
.avatar-panel {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: linear-gradient(180deg, #1a0a0a 0%, #2d1515 50%, #1a0a0a 100%);
  position: relative;
  overflow: hidden;
}

.avatar-frame {
  width: 400px;
  height: 533px;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 0 60px rgba(255, 120, 80, 0.15);
  position: relative;
}

.avatar-frame img, .avatar-frame canvas {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

#avatar-canvas {
  display: block;
  background: #2d1515;
}

.emotion-badge {
  position: absolute;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.7);
  color: #ff9966;
  padding: 4px 16px;
  border-radius: 20px;
  font-size: 13px;
  letter-spacing: 1px;
  backdrop-filter: blur(10px);
}

.avatar-name {
  margin-top: 16px;
  font-size: 22px;
  font-weight: 300;
  color: #ff9966;
  letter-spacing: 3px;
}

.fps-counter {
  position: absolute;
  top: 10px;
  right: 10px;
  font-size: 11px;
  color: #666;
  font-family: monospace;
  display: flex;
  align-items: center;
  gap: 8px;
}

#kill-btn {
  background: rgba(200, 50, 50, 0.6);
  border: 1px solid #662222;
  color: #ff8888;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s;
}
#kill-btn:hover {
  background: rgba(220, 50, 50, 0.9);
  color: white;
  transform: scale(1.15);
}

.status-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-right: 6px;
  background: #555;
  transition: background 0.3s;
}
.status-dot.connected { background: #4caf50; }
.status-dot.error { background: #f44336; }

/* Chat panel */
.chat-panel {
  display: flex;
  flex-direction: column;
  background: #120808;
  border-left: 1px solid #2d1515;
}

.chat-header {
  padding: 16px 20px;
  border-bottom: 1px solid #2d1515;
  display: flex;
  align-items: center;
  gap: 10px;
}

.chat-header h2 {
  font-size: 16px;
  font-weight: 400;
  color: #ff9966;
}

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.msg {
  max-width: 85%;
  padding: 10px 14px;
  border-radius: 16px;
  font-size: 14px;
  line-height: 1.5;
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.msg.valeria {
  align-self: flex-start;
  background: linear-gradient(135deg, #3d1f1f, #2d1515);
  border: 1px solid #4d2525;
  color: #e8d5c4;
}

.msg.valeria em { color: #ff9966; font-style: italic; }

.msg.user {
  align-self: flex-end;
  background: #2a1a0a;
  border: 1px solid #3d2a1a;
  color: #d4c4b0;
}

.msg.system {
  align-self: center;
  background: transparent;
  color: #555;
  font-size: 12px;
  padding: 4px 12px;
}

.typing-indicator {
  display: none;
  align-self: flex-start;
  padding: 8px 14px;
  color: #886;
  font-size: 13px;
  font-style: italic;
}
.typing-indicator.active { display: block; }

.input-area {
  padding: 12px 16px;
  border-top: 1px solid #2d1515;
  display: flex;
  gap: 8px;
}

.input-area input {
  flex: 1;
  background: #1a0e0e;
  border: 1px solid #3d2020;
  border-radius: 24px;
  padding: 10px 18px;
  color: #e8d5c4;
  font-size: 14px;
  outline: none;
  transition: border-color 0.3s;
}

.input-area input:focus {
  border-color: #ff9966;
}

.input-area input::placeholder {
  color: #665;
}

.input-area button {
  background: linear-gradient(135deg, #cc6633, #993311);
  border: none;
  border-radius: 50%;
  width: 40px;
  height: 40px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.2s;
}

.input-area button:hover { transform: scale(1.1); }
.input-area button:disabled { opacity: 0.4; cursor: default; transform: none; }

.input-area button svg {
  fill: white;
  width: 18px;
  height: 18px;
}

/* Scrollbar */
.messages::-webkit-scrollbar { width: 4px; }
.messages::-webkit-scrollbar-track { background: transparent; }
.messages::-webkit-scrollbar-thumb { background: #3d2020; border-radius: 2px; }

/* Mobile */
@media (max-width: 768px) {
  .container {
    grid-template-columns: 1fr;
    grid-template-rows: 40vh 60vh;
  }
  .avatar-frame { width: 200px; height: 267px; }
  .avatar-name { font-size: 16px; margin-top: 8px; }
}
</style>
</head>
<body>

<div class="container">
  <!-- Avatar Panel -->
  <div class="avatar-panel">
    <div class="avatar-frame">
      <canvas id="avatar-canvas" width="400" height="533"></canvas>
      <div class="emotion-badge" id="emotion-badge">neutral</div>
    </div>
    <div class="avatar-name">VALERIA RIOS</div>
    <div class="fps-counter">
      <span class="status-dot" id="ws-status"></span>
      <span id="fps-display">-- FPS</span>
      <button id="kill-btn" onclick="killModel()" title="Cerrar modelo y liberar memoria">✕</button>
    </div>
  </div>

  <!-- Chat Panel -->
  <div class="chat-panel">
    <div class="chat-header">
      <span class="status-dot" id="llm-status"></span>
      <h2>Valeria</h2>
    </div>

    <div class="messages" id="messages">
      <div class="msg system">Conectando con Valeria...</div>
    </div>

    <div class="typing-indicator" id="typing">Valeria esta escribiendo...</div>

    <div class="input-area">
      <input type="text" id="user-input" placeholder="Escribe algo..." autocomplete="off" />
      <button id="send-btn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
// ---------- Config ----------
const AVATAR_WS_URL = 'ws://localhost:8791/ws';
const LLM_API_URL = 'http://localhost:8790/v1/chat/completions';
const LLM_MODEL = 'fallen-mistral-small-3.1-24b-v1e';

// ---------- State ----------
let avatarWs = null;
let conversationHistory = [];
let currentEmotion = 'neutral';
let isProcessing = false;

// ---------- Avatar WebSocket ----------
function connectAvatar() {
  const statusDot = document.getElementById('ws-status');
  const fpsDisplay = document.getElementById('fps-display');
  const canvas = document.getElementById('avatar-canvas');
  const ctx = canvas.getContext('2d');

  avatarWs = new WebSocket(AVATAR_WS_URL);

  avatarWs.onopen = () => {
    statusDot.className = 'status-dot connected';
    addSystemMessage('Avatar conectado');
  };

  avatarWs.onmessage = (event) => {
    try {
      const data = JSON.parse(event.data);
      if (data.type === 'frame' && data.data) {
        // Draw frame on canvas
        const img = new Image();
        img.onload = () => {
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        };
        img.src = 'data:image/jpeg;base64,' + data.data;
        fpsDisplay.textContent = (data.fps || '--') + ' FPS';
      }
    } catch(e) {
      console.error('Frame parse error:', e);
    }
  };

  avatarWs.onerror = () => {
    statusDot.className = 'status-dot error';
  };

  avatarWs.onclose = () => {
    statusDot.className = 'status-dot';
    fpsDisplay.textContent = 'OFFLINE';
    // Reconnect after 3s
    setTimeout(connectAvatar, 3000);
  };
}

function setEmotion(emotion) {
  currentEmotion = emotion;
  document.getElementById('emotion-badge').textContent = emotion;
  if (avatarWs && avatarWs.readyState === WebSocket.OPEN) {
    avatarWs.send(JSON.stringify({ emotion }));
  }
}

// ---------- Chat / LLM ----------
function addMessage(text, sender) {
  const messagesDiv = document.getElementById('messages');
  const msgDiv = document.createElement('div');
  msgDiv.className = `msg ${sender}`;

  // Parse *actions* as italics
  let html = text
    .replace(/\*([^*]+)\*/g, '<em>$1</em>')
    .replace(/\n/g, '<br>');

  msgDiv.innerHTML = html;
  messagesDiv.appendChild(msgDiv);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function addSystemMessage(text) {
  const messagesDiv = document.getElementById('messages');
  const msgDiv = document.createElement('div');
  msgDiv.className = 'msg system';
  msgDiv.textContent = text;
  messagesDiv.appendChild(msgDiv);
}

function extractEmotion(text) {
  // Extract [emotion] tag from response
  const match = text.match(/\[(\w+)\]/);
  if (match) {
    const emotion = match[1].toLowerCase();
    const validEmotions = ['happy','sad','angry','surprised','love','shy','jealous',
      'serious','neutral','bored','suspicious','victory','sleep','relaxed'];
    if (validEmotions.includes(emotion)) {
      return { emotion, cleanText: text.replace(/\[\w+\]\s*/g, '').trim() };
    }
  }
  return { emotion: 'neutral', cleanText: text };
}

async function sendMessage() {
  const input = document.getElementById('user-input');
  const text = input.value.trim();
  if (!text || isProcessing) return;

  isProcessing = true;
  input.value = '';
  document.getElementById('send-btn').disabled = true;
  document.getElementById('typing').classList.add('active');
  document.getElementById('llm-status').className = 'status-dot connected';

  addMessage(text, 'user');

  // Build conversation
  conversationHistory.push({ role: 'user', content: text });

  try {
    console.log('[Valeria] Sending to:', LLM_API_URL);
    const res = await fetch(LLM_API_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer not-needed'
      },
      body: JSON.stringify({
        model: LLM_MODEL,
        messages: conversationHistory,
        stream: true,
        max_tokens: 1024
      })
    });

    console.log('[Valeria] Response status:', res.status);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let fullResponse = '';
    let displayText = '';
    let emotionDetected = false;

    // Create message element for streaming
    const messagesDiv = document.getElementById('messages');
    const msgDiv = document.createElement('div');
    msgDiv.className = 'msg valeria';
    messagesDiv.appendChild(msgDiv);

    let buffer = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });

      // Split on double-newline (SSE event separator) or single newline
      const parts = buffer.split('\n');
      buffer = parts.pop() || '';

      for (const part of parts) {
        const line = part.trim();
        if (!line) continue;

        // Handle "data: ..." lines (with or without space after colon)
        let jsonStr = '';
        if (line.startsWith('data:')) {
          jsonStr = line.substring(5).trim();
        } else {
          continue;
        }

        if (!jsonStr || jsonStr === '[DONE]') continue;

        try {
          const data = JSON.parse(jsonStr);
          const token = data.choices?.[0]?.delta?.content;
          if (token) {
            fullResponse += token;

            // Detect emotion from first [tag]
            if (!emotionDetected && fullResponse.includes(']')) {
              const { emotion } = extractEmotion(fullResponse);
              if (emotion !== 'neutral') {
                setEmotion(emotion);
                emotionDetected = true;
              }
            }

            // Display without emotion tags — update live
            displayText = fullResponse.replace(/\[\w+\]\s*/g, '');
            msgDiv.innerHTML = displayText
              .replace(/\*([^*]+)\*/g, '<em>$1</em>')
              .replace(/\n/g, '<br>');
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
          }
        } catch(e) {
          // Partial JSON chunk — accumulate in next iteration
          console.debug('[Valeria] Partial chunk, buffering');
        }
      }
    }

    // Final emotion check
    if (!emotionDetected) {
      const { emotion } = extractEmotion(fullResponse);
      setEmotion(emotion);
    }

    conversationHistory.push({ role: 'assistant', content: fullResponse });

    // Keep history manageable
    if (conversationHistory.length > 20) {
      conversationHistory = conversationHistory.slice(-16);
    }

  } catch(e) {
    console.error('[Valeria] LLM error:', e);
    // Fallback: try non-streaming
    try {
      console.log('[Valeria] Trying non-streaming fallback...');
      const res2 = await fetch(LLM_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer not-needed' },
        body: JSON.stringify({
          model: LLM_MODEL,
          messages: conversationHistory,
          stream: false,
          max_tokens: 1024
        })
      });
      if (res2.ok) {
        const data = await res2.json();
        const content = data.choices?.[0]?.message?.content || '';
        const { emotion, cleanText } = extractEmotion(content);
        setEmotion(emotion);
        addMessage(cleanText, 'valeria');
        conversationHistory.push({ role: 'assistant', content });
      } else {
        addSystemMessage('Error: ' + res2.status);
      }
    } catch(e2) {
      addSystemMessage('Error de conexion: ' + e2.message);
    }
    document.getElementById('llm-status').className = 'status-dot error';
  } finally {
    isProcessing = false;
    document.getElementById('send-btn').disabled = false;
    document.getElementById('typing').classList.remove('active');
  }
}

// ---------- Kill Model ----------
async function killModel() {
  if (!confirm('¿Cerrar el modelo y liberar memoria GPU?')) return;
  const btn = document.getElementById('kill-btn');
  btn.disabled = true;
  btn.textContent = '…';
  try {
    await fetch(AVATAR_WS_URL.replace('ws://', 'http://').replace('/ws', '/api/shutdown'), { method: 'POST' });
  } catch(e) { /* server died — expected */ }
  document.getElementById('ws-status').className = 'status-dot error';
  document.getElementById('fps-display').textContent = 'KILLED';
  document.getElementById('emotion-badge').textContent = 'offline';
  const ctx = document.getElementById('avatar-canvas').getContext('2d');
  ctx.fillStyle = '#1a0a0a';
  ctx.fillRect(0, 0, 400, 533);
  ctx.fillStyle = '#555';
  ctx.font = '16px system-ui';
  ctx.textAlign = 'center';
  ctx.fillText('Modelo cerrado', 200, 260);
  ctx.fillText('Memoria liberada', 200, 285);
  addSystemMessage('Modelo LivePortrait cerrado — memoria GPU liberada');
}

// ---------- Init ----------
document.getElementById('user-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendMessage();
});

// Connect avatar WebSocket
connectAvatar();

// Hardcoded first message (no API call needed)
setTimeout(() => {
  setEmotion('happy');
  addMessage('*se acomoda el uniforme y te mira con una sonrisa* Hola papi, por fin apareces... ya me estaba aburriendo aqui sola en el turno.', 'valeria');
}, 1000);
</script>

</body>
</html>
